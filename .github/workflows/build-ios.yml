name: Build iPhone keyboard for sideloading
on:
  workflow_dispatch:
    inputs:
      publish_run_id:
        description: 只发布：填一次已通过的构建编号，把它的安装包发到 SideStore 固定下载地址（不重新编译）
        required: false
        default: ''
      simulator_tests:
        description: 同时跑模拟器界面测试（多用约 15 分钟 Mac 时间；改了键盘布局或发版前再勾）
        type: boolean
        required: false
        default: false
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: capswriter-ios-${{ github.ref }}-${{ inputs.publish_run_id }}
  cancel-in-progress: true
env:
  # Public, release-only repository. The app's update button downloads
  # releases/download/lab-phone-asr/CapsWriterLab-sideload.ipa from here,
  # so the code repository itself can stay private.
  RELEASES_REPO: Yhaijiao/saykey-releases
  RELEASE_TAG: lab-phone-asr
jobs:
  # Same as 发布实验包.ps1: put a passed build's IPA on the fixed
  # download that Lab's "用 SideStore 安装更新" opens.
  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_run_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
      RUN_ID: ${{ inputs.publish_run_id }}
    steps:
      - name: Check the build passed
        run: |
          case "$RUN_ID" in (*[!0-9]*|'') echo "构建编号只能是数字"; exit 1;; esac
          if [ -z "$RELEASES_TOKEN" ]; then
            echo "缺少 RELEASES_TOKEN：请在本仓库 Settings → Secrets and variables → Actions 里添加（能写 $RELEASES_REPO 的令牌）"
            exit 1
          fi
          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json conclusion,headBranch,headSha,workflowName \
            --jq '"\(.workflowName) · \(.headBranch) · \(.headSha[0:7]) · \(.conclusion)"'
          test "$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)" = success
          echo "HEAD_SHA=$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json headSha --jq '.headSha[0:7]')" >> "$GITHUB_ENV"
      - name: Download and verify the IPA
        run: |
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name CapsWriterLab-IPA --dir ipa
          cd ipa
          IPA=$(ls CapsWriterLab-*-sideload.ipa | head -n 1)
          test -n "$IPA"
          sha256sum -c SHA256SUMS.txt
          echo "安装包：$IPA"
          VERSION=${IPA#CapsWriterLab-}
          echo "VERSION=${VERSION%-sideload.ipa}" >> "$GITHUB_ENV"
          echo "SHA256=$(sha256sum "$IPA" | cut -d' ' -f1)" >> "$GITHUB_ENV"
          cp "$IPA" "$RUNNER_TEMP/CapsWriterLab-sideload.ipa"
      - name: Upload to the public release-only repository
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          NOTES="SayKey Lab $VERSION（构建 $RUN_ID，提交 $HEAD_SHA）
          SHA-256：$SHA256
          在 Lab「更新与续签」点「用 SideStore 安装更新」即可安装。"
          if ! gh release view "$RELEASE_TAG" --repo "$RELEASES_REPO" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$RELEASES_REPO" --title "SayKey Lab 安装包" --notes "$NOTES"
          fi
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/CapsWriterLab-sideload.ipa" --repo "$RELEASES_REPO" --clobber
          gh release edit "$RELEASE_TAG" --repo "$RELEASES_REPO" --notes "$NOTES"
          echo "已发布：https://github.com/$RELEASES_REPO/releases/download/$RELEASE_TAG/CapsWriterLab-sideload.ipa"
      - name: Also refresh the old download in this repository
        # Phones on 0.4.28 or older still open this repository's release.
        # Once this repository is private they can no longer reach it, so
        # a failure here never blocks publishing.
        continue-on-error: true
        run: gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/CapsWriterLab-sideload.ipa" --repo "$GITHUB_REPOSITORY" --clobber

  # Linux minutes cost a tenth of macOS minutes on a private repository,
  # so everything that does not need Xcode runs here.
  checks:
    if: github.event_name != 'workflow_dispatch' || inputs.publish_run_id == ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate source and bridge behavior
        run: |
          python3 -B scripts/check_sources.py
          python3 -B -m unittest discover -s scripts -p 'test_*.py' -v
          python3 -m venv "$RUNNER_TEMP/cw-bridge-venv"
          "$RUNNER_TEMP/cw-bridge-venv/bin/pip" install -r bridge/requirements.txt
          "$RUNNER_TEMP/cw-bridge-venv/bin/python" -B -m unittest discover -s bridge -p 'test_*.py' -v

  build:
    needs: checks
    runs-on: macos-15-intel
    timeout-minutes: 45
    env:
      # Simulator UI tests take ~15 of the ~18 macOS minutes. Run them on
      # main and when asked; everyday builds stop after the IPA.
      RUN_SIMULATOR_TESTS: ${{ github.event_name == 'push' || inputs.simulator_tests }}
    steps:
      - uses: actions/checkout@v4
      - name: Check toolchain
        run: |
          SELECTED_XCODE=$(python3 -c 'import glob,re; paths=[(tuple(map(int,m.group(1).split("."))),p) for p in glob.glob("/Applications/Xcode_*.app") if (m:=re.search(r"Xcode_(\d+(?:\.\d+)*)\.app$",p))]; print(max(paths)[1]+"/Contents/Developer" if paths else "")')
          if [ -n "$SELECTED_XCODE" ]; then
            export DEVELOPER_DIR="$SELECTED_XCODE"
            echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Test bundled offline pinyin
        run: |
          mkdir -p build
          swiftc -parse-as-library ios/Shared/PinyinEngine.swift ios/Shared/VoiceResultDelivery.swift scripts/PinyinSmoke.swift -o build/pinyin-smoke
          build/pinyin-smoke ios/Shared/pinyin-lexicon.json
          swiftc -parse-as-library ios/Shared/WordSuggestions.swift ios/Shared/UserLexicon.swift ios/Shared/PinyinEngine.swift scripts/SuggestSmoke.swift -o build/suggest-smoke
          build/suggest-smoke ios/Shared
          swiftc -parse-as-library ios/Shared/BridgeEndpoint.swift scripts/EndpointSmoke.swift -o build/endpoint-smoke
          build/endpoint-smoke
      - name: Generate project
        run: |
          command -v xcodegen || brew install xcodegen
          xcodegen generate
      - name: Build for physical iPhone
        run: |
          set -o pipefail
          xcodebuild -project CapsWriterKeyboard.xcodeproj -scheme CapsWriterLab \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/device CODE_SIGNING_ALLOWED=NO build | tee build-device.log
      - name: Package IPA with shared-keychain signing template
        run: |
          set -o pipefail
          APP=artifacts/Payload/CapsWriterLab.app
          KEYBOARD="$APP/PlugIns/CapsWriterKeyboard.appex"
          ACTIVITY="$APP/PlugIns/CapsWriterVoiceActivity.appex"
          mkdir -p artifacts/Payload
          ditto build/device/Build/Products/Release-iphoneos/CapsWriterLab.app "$APP"
          test -d "$KEYBOARD"
          test -d "$ACTIVITY"
          codesign --force --sign - "$ACTIVITY"
          sed 's/$(AppIdentifierPrefix)/CAPSWTEST0./g' ios/App/CapsWriterLab.entitlements > build/sideload.entitlements
          for BUNDLE in "$KEYBOARD" "$APP"; do
            codesign --force --sign - --generate-entitlement-der --entitlements build/sideload.entitlements "$BUNDLE"
            codesign --display --entitlements - --xml "$BUNDLE" > build/sideload-observed.plist
            test "$(/usr/libexec/PlistBuddy -c 'Print :keychain-access-groups:0' build/sideload-observed.plist)" = CAPSWTEST0.org.capswriterlab.voice-pairings
          done
          codesign --verify --deep --strict "$APP"
          cd artifacts
          zip -qr CapsWriterLab-0.4.29-sideload.ipa Payload
          shasum -a 256 CapsWriterLab-0.4.29-sideload.ipa > SHA256SUMS.txt
          rm -r Payload
      - name: Verify package
        run: python3 scripts/verify_ipa.py artifacts/CapsWriterLab-0.4.29-sideload.ipa 0.4.29
      - name: Upload install package before simulator tests
        uses: actions/upload-artifact@v4
        with:
          name: CapsWriterLab-IPA
          path: |
            artifacts/*.ipa
            artifacts/SHA256SUMS.txt
          retention-days: 14
      - name: Build simulator and take screenshot
        if: env.RUN_SIMULATOR_TESTS == 'true'
        run: |
          set -o pipefail
          xcodebuild -project CapsWriterKeyboard.xcodeproj -scheme CapsWriterLab \
            -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/simulator CODE_SIGNING_ALLOWED=NO build | tee build-simulator.log
          IOS_SDK=$(xcrun --sdk iphonesimulator --show-sdk-version)
          xcrun simctl list runtimes available --json > build/simulator-runtimes.json
          RUNTIME_ID=$(python3 scripts/select_simulator_runtime.py --sdk "$IOS_SDK" --json-file build/simulator-runtimes.json)
          DEVICE_ID=$(xcrun simctl create CapsWriter-QA 'iPhone 15 Pro Max' "$RUNTIME_ID")
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool NO
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl install "$DEVICE_ID" build/simulator/Build/Products/Debug-iphonesimulator/CapsWriterLab.app
          xcrun simctl launch "$DEVICE_ID" org.capswriterlab.keyboard
          sleep 3
          xcrun simctl io "$DEVICE_ID" screenshot artifacts/app-simulator.png
          echo "$DEVICE_ID" > build/simulator-device-id.txt
      - name: Validate keyboard construction and row alignment
        if: env.RUN_SIMULATOR_TESTS == 'true'
        timeout-minutes: 10
        run: |
          set -o pipefail
          DEVICE_ID=$(cat build/simulator-device-id.txt)
          TEST_RESULT=0
          xcodebuild test -project CapsWriterKeyboard.xcodeproj -scheme CapsWriterLab \
            -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath build/simulator -resultBundlePath artifacts/KeyboardLayoutTests.xcresult \
            -parallel-testing-enabled NO -only-testing:KeyboardLayoutTests \
            CODE_SIGNING_ALLOWED=NO | tee test-keyboard-layout.log || TEST_RESULT=$?
          echo "$TEST_RESULT" > artifacts/keyboard-layout-test-exit-code.txt
          xcrun xcresulttool export attachments --path artifacts/KeyboardLayoutTests.xcresult \
            --output-path artifacts/layout-test-attachments || true
          exit "$TEST_RESULT"
      - name: Upload keyboard layout validation
        if: always() && env.RUN_SIMULATOR_TESTS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: CapsWriterLab-LayoutValidation
          path: |
            artifacts/keyboard-layout-test-exit-code.txt
            artifacts/layout-test-attachments/
            test-keyboard-layout.log
          retention-days: 14
      - name: Exercise real keyboard in simulator
        if: env.RUN_SIMULATOR_TESTS == 'true'
        timeout-minutes: 22
        run: |
          set -o pipefail
          DEVICE_ID=$(cat build/simulator-device-id.txt)
          TEST_RESULT=0
          xcodebuild test -project CapsWriterKeyboard.xcodeproj -scheme CapsWriterLab \
            -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath build/simulator -resultBundlePath artifacts/KeyboardSmokeTests.xcresult \
            -parallel-testing-enabled NO -only-testing:KeyboardSmokeTests \
            CODE_SIGNING_ALLOWED=NO | tee test-simulator.log || TEST_RESULT=$?
          echo "$TEST_RESULT" > artifacts/simulator-ui-test-exit-code.txt
          xcrun xcresulttool export attachments --path artifacts/KeyboardSmokeTests.xcresult \
            --output-path artifacts/keyboard-test-attachments || true
          xcrun simctl io "$DEVICE_ID" screenshot artifacts/after-ui-test.png || true
          xcrun simctl spawn "$DEVICE_ID" log show --last 20m --style compact \
            --predicate 'process == "CapsWriterKeyboard" OR process == "CapsWriterLab"' \
            > artifacts/keyboard-runtime.log || true
          xcrun simctl shutdown "$DEVICE_ID"
          exit "$TEST_RESULT"
      - uses: actions/upload-artifact@v4
        if: always() && env.RUN_SIMULATOR_TESTS == 'true'
        with:
          name: CapsWriterLab-iPhone
          path: |
            artifacts/*.ipa
            artifacts/SHA256SUMS.txt
            artifacts/*.png
            artifacts/*exit-code.txt
            artifacts/keyboard-runtime.log
            artifacts/keyboard-test-attachments/
            artifacts/layout-test-attachments/
            test-keyboard-layout.log
            build-device.log
            build-simulator.log
            test-simulator.log
          retention-days: 14
